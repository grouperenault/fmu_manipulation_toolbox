# Reusable workflow that builds the native binaries (container, remoting) of
# one OS through the workflow presets of CMakePresets.json, and uploads them as
# one artifact. It is called with a matrix from the CI workflow so all the
# per-platform build logic lives in CMakePresets.json and here.
name: build-native

on:
  workflow_call:
    inputs:
      os:
        description: "Runner image (e.g. windows-latest, ubuntu-22.04, macos-latest)."
        required: true
        type: string
      presets:
        description: "Workflow presets of CMakePresets.json to run, separated by spaces (e.g. `win64 win32`)."
        required: true
        type: string
      artifact_name:
        description: "Name of the uploaded artifact."
        required: true
        type: string
      resource_subdirs:
        description: "resources/<subdir> folders holding the produced binaries, separated by spaces (e.g. `win64 win32`)."
        required: true
        type: string
      install_multilib:
        description: "Install gcc-multilib (needed for the 32-bit Linux build)."
        required: false
        type: boolean
        default: false

# This workflow only reads the repo and uploads artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install 32-bit toolchain
        if: inputs.install_multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      # Configure, build and, for the presets that build the container, run the native tests.
      - name: Build and test
        shell: bash
        run: |
          for preset in ${{ inputs.presets }}; do
            cmake --workflow --preset "$preset"
          done

      # The artifact holds the <subdir> folders, to be downloaded into resources/. They are staged in one folder: with
      # a single path, upload-artifact would drop the <subdir> level.
      - name: Stage the binaries
        shell: bash
        run: |
          mkdir -p native-artifact
          for subdir in ${{ inputs.resource_subdirs }}; do
            cp -R "fmu_manipulation_toolbox/resources/$subdir" native-artifact/
          done

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: native-artifact
          retention-days: 1
