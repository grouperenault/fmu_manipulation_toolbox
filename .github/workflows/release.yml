# Release: triggered by version tags (V*). It reuses the full CI pipeline
# (build + tests + package) via `workflow_call`, then publishes the resulting
# package to PyPI. Keeping the tests in the path preserves the "tests gate the
# publication" behaviour of the previous single workflow.
name: Release

on:
  push:
    tags:
      # Accept both upper- and lower-case prefixes (V1.2.3 or v1.2.3); PEP 440
      # normalises the leading letter away for the published version.
      - "V*"
      - "v*"
  workflow_dispatch:

# Default read-only; jobs raise what they need.
permissions:
  contents: read

# Never cancel an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run the exact same build + test + package pipeline as CI. The `package`
  # artifact it uploads is consumed by the publish job below. Because this runs
  # on the tag ref, setup.py derives the version from the tag name.
  ci:
    uses: ./.github/workflows/ci.yml
    # The called workflow's `tests-win64` job requests `contents: write` (coverage
    # badge). A called (reusable) workflow cannot exceed the caller's token, so
    # grant it here to avoid a startup failure.
    permissions:
      contents: write

  publish:
    # Extra guard: only publish for real version tags, never for a manual
    # dispatch from a branch. Case-insensitive to match the tag trigger above.
    if: startsWith(github.ref, 'refs/tags/V') || startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      # Create the GitHub Release and upload the built artifacts.
      contents: write
      # OIDC Trusted Publishing to PyPI (no long-lived API token needed).
      id-token: write
    steps:
    - uses: actions/download-artifact@v5
      with:
        name: package
        path: dist
    # Authentication uses OIDC Trusted Publishing configured on PyPI for this
    # project, so no username/password is provided. The PyPI Trusted Publisher
    # MUST reference this workflow file name (release.yml) and a matching
    # environment (none here). `release/v1` is PyPA's maintained tag with full
    # OIDC support.
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
    - name: Determine pre-release flag
      id: prerelease
      shell: bash
      run: |
        # Mark the GitHub Release as a pre-release when the tag carries a PEP 440
        # pre/dev suffix (e.g. V1.9.4b1, V1.9.4rc3, V1.9.4a1, V1.9.4.dev1).
        if echo "${GITHUB_REF_NAME}" | grep -Eiq '(a|b|rc|dev)[0-9]*$'; then
          echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
        else
          echo "flag=" >> "$GITHUB_OUTPUT"
        fi
    # Create the GitHub Release with the built wheel + sdist attached, using the
    # official GitHub CLI (no third-party action).
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" dist/* \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --generate-notes \
          ${{ steps.prerelease.outputs.flag }}

