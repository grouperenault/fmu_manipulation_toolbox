[pytest]
# The test suite is organised by type: `unit/` (fast, pure-Python), `integration/`
# (container/split/CLI, file I/O, optional simulation) and `gui/` (PySide6 + pytest-qt).
#
# `pythonpath = .` makes the `tests/` directory (for `_helpers` and `conftest`)
# importable when pytest is invoked from within `tests/` (as the CI does). The
# `fmu_manipulation_toolbox` package itself must be installed, e.g. with
# `pip install -e ".[all]"` from the repository root.
pythonpath = .
testpaths =
    unit
    integration
    gui

markers =
    unit: fast, pure-Python tests (no FMI simulation).
    integration: build containers/split/CLI, perform file I/O.
    gui: require PySide6 and pytest-qt.
    slow: end-to-end tests running an FMI simulation (fmpy).
    needs_fmpy: require the `fmpy` package (simulation / validation).
    needs_container: require the compiled container binary in resources/.
    needs_remoting: require the compiled remoting binaries in resources/.
    windows_only: only run on win32.
    fmi2: exercises FMI 2.0.
    fmi3: exercises FMI 3.0.
    lsbus: exercises the LS-BUS feature.
    area(name): select the tests/data/<name> directory copied into tests/tmp/<test>.




